[project]
name = "shipmill"
version = "0.42.0"
description = "The open-source AI software factory for GitHub: agents triage issues and land pull requests, and release lanes publish, deploy, and roll back by policy"
readme = "README.md"
license = "MIT"
authors = [{ name = "Roman Medvedev" }]
requires-python = ">=3.14"
keywords = [
    "ai-agents",
    "claude-code",
    "github",
    "github-actions",
    "issue-triage",
    "release-automation",
    "changelog",
    "continuous-delivery",
    "semantic-versioning",
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.scripts]
shipmill = "shipmill.cli:run"

[project.urls]
Homepage = "https://shipmill.github.io/shipmill/"
Documentation = "https://github.com/shipmill/shipmill/tree/main/docs"
Repository = "https://github.com/shipmill/shipmill"
Issues = "https://github.com/shipmill/shipmill/issues"
Changelog = "https://github.com/shipmill/shipmill/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "shipmill/skills" # the gate runs the skills' state scripts

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.13"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
