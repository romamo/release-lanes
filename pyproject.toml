[project]
name = "shipmill"
version = "0.22.0"
description = "Issue to release on GitHub: agent skills that triage issues and land pull requests, and release lanes cut by policy from a hand-written CHANGELOG"
readme = "README.md"
license = "MIT"
authors = [{ name = "Romamo" }]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.scripts]
shipmill = "shipmill.cli:run"

[project.urls]
Repository = "https://github.com/shipmill/shipmill"
Changelog = "https://github.com/shipmill/shipmill/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "shipmill/skills" # the gate runs the skills' state scripts

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.13"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
