<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background-color:#f6f9f9;background-image:linear-gradient(#dcebea 1px,transparent 1px),linear-gradient(90deg,#dcebea 1px,transparent 1px);background-size:28px 28px;color:#17263a;font-family:"Public Sans",sans-serif;
 display:grid;grid-template-columns:600px 1fr;align-items:center;gap:20px;padding:0 48px 0 64px;box-sizing:border-box;border-bottom:14px solid #17263a}
.brand{font:700 30px "Unbounded",sans-serif;display:flex;align-items:center;gap:14px;margin-bottom:36px;letter-spacing:-.01em}
h1{font:800 64px/1.04 "Unbounded",sans-serif;letter-spacing:-.035em;margin:0 0 30px;white-space:nowrap}
h1 .out{color:#f6f9f9;background:#17263a;padding:0 .14em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:.08em .08em 0 #ff6a3d}
p{font:400 27px/1.4 "Public Sans",sans-serif;color:#546173;margin:0 0 28px}
.url{font:700 24px "JetBrains Mono",monospace}
svg.art{width:100%;height:auto;display:block}
.belt-run,.gear{animation:none!important}
</style></head><body>
<div><div class="brand"><svg width="44" height="44" viewBox="0 0 28 28"><circle cx="14" cy="14" r="5" fill="#ff6a3d" stroke="#17263a" stroke-width="2"/><g stroke="#17263a" stroke-width="2.5" stroke-linecap="round"><path d="M14 2v6M14 20v6M2 14h6M20 14h6M5.5 5.5l4.2 4.2M18.3 18.3l4.2 4.2M5.5 22.5l4.2-4.2M18.3 9.7l4.2-4.2"/></g></svg>shipmill</div>
<h1>Issues in.<br><span class="out">Releases out.</span></h1>
<p>Agents triage, fix and land.<br>Your policy cuts the release.</p>
<div class="url">shipmill.dev</div></div>
<div><svg class="art" viewBox="0 0 520 380" role="img" aria-label="Issue cards drop onto a conveyor belt that carries them through three stations, triage, fix and land, past a raised policy gate, into a crate stamped v0.41.2 that ships to PyPI">
            <defs><clipPath id="beltclip"><rect x="26" y="230" width="340" height="40"/></clipPath></defs>
            <!-- annotation: issues in -->
            <text x="28" y="40" font-family="Unbounded, sans-serif" font-size="15" font-weight="700" fill="#17263a">issues in</text>
            <path d="M60 50 C62 66 58 78 52 92" fill="none" stroke="#17263a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
            <!-- falling issue cards -->
            <g font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#17263a">
              <g transform="rotate(-10 52 112)"><rect x="30" y="98" width="46" height="28" rx="5" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><circle cx="40" cy="112" r="3.5" fill="#ff6a3d"/><text x="47" y="116">#314</text></g>
              <g transform="rotate(8 62 166)"><rect x="40" y="152" width="46" height="28" rx="5" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><circle cx="50" cy="166" r="3.5" fill="#ff6a3d"/><text x="57" y="170">#313</text></g>
            </g>
            <!-- stations -->
            <g font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#17263a" text-anchor="middle">
              <g><path d="M88 236 V128 M148 236 V128" stroke="#17263a" stroke-width="2.5"/><rect x="80" y="104" width="76" height="26" rx="6" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><text x="118" y="122">triage</text>
                <circle cx="114" cy="166" r="12" fill="#e3efee" stroke="#17263a" stroke-width="2.5"/><path d="M123 175 l10 10" stroke="#17263a" stroke-width="4" stroke-linecap="round"/></g>
              <g><path d="M188 236 V128 M248 236 V128" stroke="#17263a" stroke-width="2.5"/><rect x="180" y="104" width="76" height="26" rx="6" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><text x="218" y="122">fix</text>
                <path d="M206 186 L224 164" stroke="#17263a" stroke-width="6" stroke-linecap="round"/><circle cx="228" cy="159" r="9" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><path d="M228 150 v6" stroke="#f6f9f9" stroke-width="5"/></g>
              <g><path d="M288 236 V128 M348 236 V128" stroke="#17263a" stroke-width="2.5"/><rect x="280" y="104" width="76" height="26" rx="6" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/><text x="318" y="122">land</text>
                <circle cx="318" cy="168" r="14" fill="#1f9d63" stroke="#17263a" stroke-width="2.5"/><path d="M311 168 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="208" font-size="10" fill="#546173">CI green</text></g>
            </g>
            <!-- belt cards, moving -->
            <g clip-path="url(#beltclip)">
              <g class="belt-run" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#17263a">
                <g transform="translate(-74 0)"><rect x="0" y="238" width="40" height="22" rx="4" fill="#ffffff" stroke="#17263a" stroke-width="2"/><circle cx="9" cy="249" r="3" fill="#ff6a3d"/></g>
                <g transform="translate(26 0)"><rect x="0" y="238" width="40" height="22" rx="4" fill="#ffffff" stroke="#17263a" stroke-width="2"/><circle cx="9" cy="249" r="3" fill="#ff6a3d"/></g>
                <g transform="translate(126 0)"><rect x="0" y="238" width="40" height="22" rx="4" fill="#e3efee" stroke="#17263a" stroke-width="2"/><circle cx="9" cy="249" r="3" fill="#17263a"/></g>
                <g transform="translate(226 0)"><rect x="0" y="238" width="40" height="22" rx="4" fill="#e3efee" stroke="#17263a" stroke-width="2"/><circle cx="9" cy="249" r="3" fill="#1f9d63"/></g>
                <g transform="translate(326 0)"><rect x="0" y="238" width="40" height="22" rx="4" fill="#e3efee" stroke="#17263a" stroke-width="2"/><circle cx="9" cy="249" r="3" fill="#1f9d63"/></g>
              </g>
            </g>
            <!-- belt -->
            <rect x="20" y="262" width="360" height="28" rx="14" fill="#ffffff" stroke="#17263a" stroke-width="3"/>
            <g fill="#e3efee" stroke="#17263a" stroke-width="2">
              <g class="gear"><circle cx="40" cy="276" r="8"/><path d="M34 276h12" stroke-width="2"/></g>
              <g class="gear"><circle cx="120" cy="276" r="8"/><path d="M114 276h12" stroke-width="2"/></g>
              <g class="gear"><circle cx="200" cy="276" r="8"/><path d="M194 276h12" stroke-width="2"/></g>
              <g class="gear"><circle cx="280" cy="276" r="8"/><path d="M274 276h12" stroke-width="2"/></g>
              <g class="gear"><circle cx="360" cy="276" r="8"/><path d="M354 276h12" stroke-width="2"/></g>
            </g>
            <path d="M60 290 v38 M340 290 v38" stroke="#17263a" stroke-width="3" stroke-linecap="round"/>
            <path d="M0 330 H520" stroke="#17263a" stroke-width="2.5" stroke-linecap="round"/>
            <!-- policy gate -->
            <rect x="384" y="196" width="10" height="134" rx="3" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/>
            <g transform="rotate(-38 389 204)">
              <rect x="389" y="198" width="96" height="12" rx="6" fill="#ffffff" stroke="#17263a" stroke-width="2.5"/>
              <path d="M405 199 l-6 10 M425 199 l-6 10 M445 199 l-6 10 M465 199 l-6 10" stroke="#ff6a3d" stroke-width="5"/>
            </g>
            <g transform="rotate(-4 356 180)"><rect x="330" y="62" width="112" height="26" rx="5" fill="#ff6a3d" stroke="#17263a" stroke-width="2.5"/><text x="342" y="80" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#17263a">shipmill.toml</text></g>
            <path d="M392 92 C396 130 392 160 389 190" fill="none" stroke="#17263a" stroke-width="2" stroke-dasharray="4 5"/>
            <!-- crate -->
            <g transform="translate(404 252)">
              <rect x="0" y="0" width="104" height="78" rx="6" fill="#ffffff" stroke="#17263a" stroke-width="3"/>
              <path d="M0 22 H104" stroke="#17263a" stroke-width="2.5"/>
              <rect x="40" y="0" width="24" height="22" fill="#ff6a3d" stroke="#17263a" stroke-width="2.5"/>
              <text x="52" y="54" text-anchor="middle" font-family="Unbounded, sans-serif" font-size="15" font-weight="700" fill="#17263a">v0.41.2</text>
              <text x="52" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#546173">stable</text>
            </g>
            <!-- shipped -->
            <path d="M470 244 C480 200 488 170 476 136" fill="none" stroke="#17263a" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M468 142 l8 -8 l6 10" fill="none" stroke="#17263a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="508" y="116" text-anchor="end" font-family="Unbounded, sans-serif" font-size="15" font-weight="700" fill="#17263a">releases out</text>
            <text x="508" y="134" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#546173">PyPI · GitHub</text>
          </svg></div>
</body></html>
