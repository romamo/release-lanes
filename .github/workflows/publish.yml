name: Publish to PyPI

# Each stable and hotfix release publishes shipmill to PyPI (spec 010). shipmill's land
# workflow starts this one on the default branch with the release's tag, and it builds that
# tag. The upload authenticates through trusted publishing: pypi.org trusts this workflow in
# the `pypi` environment, so no token is stored anywhere.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, such as v0.30.0"
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Check the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::pyproject.toml at $TAG holds version $version, not ${TAG#v}"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke-test the wheel
        run: |
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected one wheel in dist/, found ${wheels[*]}"
            exit 1
          fi
          wheel="$PWD/${wheels[0]}"
          smoke="$RUNNER_TEMP/smoke"
          uv venv --no-project "$smoke"
          uv pip install --python "$smoke/bin/python" "$wheel"
          cd "$smoke"
          bin/shipmill --help
          package=$(bin/python -c 'import pathlib, shipmill; print(pathlib.Path(shipmill.__file__).parent)')
          for script in \
            skills/github-ship-watch/scripts/watch_state.py \
            skills/github-issue-triage/scripts/triage_state.py; do
            if [ ! -f "$package/$script" ]; then
              echo "::error::the wheel has no shipmill/$script"
              exit 1
            fi
          done

      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
