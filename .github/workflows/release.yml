name: Release

# release-lanes dogfoods itself: the same wiring `release-lanes init` writes, but
# calling the reusable workflows in this repository and running the tool from the checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: "Release this lane now, skipping its triggers (gates still apply); empty follows the policy"
        type: choice
        options: ["", stable, hotfix]
        default: ""
      dry-run:
        description: "Show the release commit, push nothing"
        type: boolean
        default: true
      hotfix-prs:
        description: "hotfix: merged pull requests to ship, such as 12,15"
        type: string
        default: ""
      hotfix-from:
        description: "hotfix: the stable tag to fix; empty takes the latest"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    with:
      lane: ${{ inputs.lane || '' }}
      dry-run: ${{ inputs.dry-run || false }}
      hotfix-prs: ${{ inputs.hotfix-prs || '' }}
      hotfix-from: ${{ inputs.hotfix-from || '' }}
      tool: "."
    permissions:
      contents: write
      issues: read
      pull-requests: read

  ci:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  land:
    needs: [prepare, ci]
    if: always() && needs.prepare.outputs.sha != ''
    uses: ./.github/workflows/land.yml
    with:
      ci-result: ${{ needs.ci.result }}
      lane: ${{ needs.prepare.outputs.lane }}
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
      base: ${{ needs.prepare.outputs.base }}
      tool: "."
    permissions:
      contents: write
      actions: write
