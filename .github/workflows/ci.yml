name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # shipmill's Release workflow runs it on its release commit
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's commit

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - run: uv sync --locked
      - run: uv run ruff check src tests skills
      - run: uv run ruff format --check src tests skills
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Check the specs, and that a test proves each criterion of a built one
        run: |
          uv run --no-project python skills/github-issue-triage/scripts/specs.py check
          uv run --no-project python skills/github-issue-triage/scripts/specs.py coverage
      - name: Lint the workflows, including the template init writes
        run: |
          uvx --from actionlint-py actionlint .github/workflows/*.yml
          uv run python -c "
          import sys
          from pathlib import Path
          from shipmill.init import Detected, RunsOn, caller_text
          from shipmill.policy import Style, VersionFiles
          d = Detected('demo', 'main', Style.KEEP_A_CHANGELOG, VersionFiles.NONE)
          out = Path(sys.argv[1])
          (out / 'release.yml').write_text(caller_text(d, 'ci.yml'))
          (out / 'release-label.yml').write_text(caller_text(d, 'ci.yml', RunsOn.parse('self-hosted')))
          (out / 'release-list.yml').write_text(caller_text(d, 'ci.yml', RunsOn.parse('[\"self-hosted\", \"linux\"]')))
          " "$RUNNER_TEMP"
          uvx --from actionlint-py actionlint -ignore 'ci.yml' \
            "$RUNNER_TEMP/release.yml" "$RUNNER_TEMP/release-label.yml" "$RUNNER_TEMP/release-list.yml"
          uv run python -c "from shipmill.init import operate_caller_text; print(operate_caller_text())" \
            > "$RUNNER_TEMP/operate.yml"
          uvx --from actionlint-py actionlint "$RUNNER_TEMP/operate.yml"
