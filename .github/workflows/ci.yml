name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # shipyard's Release workflow runs it on its release commit
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's commit

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - run: uv sync --locked
      - run: uv run ruff check src tests skills
      - run: uv run ruff format --check src tests skills
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Lint the workflows, including the template init writes
        run: |
          uvx --from actionlint-py actionlint .github/workflows/*.yml
          uv run python -c "
          from shipyard.init import Detected, caller_text
          from shipyard.policy import Style, VersionFiles
          print(caller_text(Detected('demo', 'main', Style.KEEP_A_CHANGELOG, VersionFiles.NONE), 'ci.yml'))
          " > "$RUNNER_TEMP/release.yml"
          uvx --from actionlint-py actionlint -ignore 'ci.yml' "$RUNNER_TEMP/release.yml"
          uv run python -c "from shipyard.init import operate_caller_text; print(operate_caller_text())" \
            > "$RUNNER_TEMP/operate.yml"
          uvx --from actionlint-py actionlint "$RUNNER_TEMP/operate.yml"
