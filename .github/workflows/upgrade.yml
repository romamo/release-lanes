name: shipmill upgrade

# Called by the caller's release workflow in its own job, after the release jobs (spec 014).
# It opens or updates one shipmill-upgrade issue per config upgrade the repo hasn't decided or
# declined, none under [autonomy] upgrade = "observe", and closes the issue of each upgrade
# the config now sets. It never edits the config: a person or an agent session does, through
# a pull request.

on:
  workflow_call:
    inputs:
      tool:
        type: string
        default: "git+https://github.com/shipmill/shipmill@v0"

# No permissions anywhere: the job runs with the caller's grant, `contents: read` and
# `issues: write`. A nested job asking for more than its caller grants fails the whole run, so
# a caller without `issues: write` still starts this workflow, and only this job fails, naming
# the upgrade, after the release jobs ran

jobs:
  propose:
    concurrency:
      group: shipmill-upgrade
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Propose the pending config upgrades
        shell: bash # -eo pipefail: a failed propose fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
        run: |
          uvx --from "$TOOL" shipmill upgrade --propose | tee -a "$GITHUB_STEP_SUMMARY"
