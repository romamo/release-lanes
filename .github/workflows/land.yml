name: shipyard land

# Called after the caller's CI ran on the release commit. When CI passed it lands the
# release: main (a stable release on an unmoved main), release/X.Y (a hotfix), or the tag
# alone (a pre-release, or a stable release promoted while main moved on, which then gets a
# sync commit on main). It tags, publishes, and starts the lane's dispatch workflows.
# Whatever happened, the work branch is deleted: a failed release is planned again. Under
# release = "propose" it then closes the lane's proposal issue.

on:
  workflow_call:
    inputs:
      ci-result:
        type: string
        required: true
      lane:
        type: string
        required: true
      version:
        type: string
        required: true
      sha:
        type: string
        required: true
      base:
        type: string
        required: true
      tool:
        type: string
        default: "git+https://github.com/romamo/shipyard@v0"

# No workflow-level permissions: each job sets its own, except close-proposal, which takes
# the caller's grant, so a caller that grants no `issues: write` still starts this workflow

jobs:
  land:
    if: inputs.ci-result == 'success'
    concurrency:
      group: shipyard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # main, release branches, tags, and releases
      actions: write # starts dispatch workflows; a push with this token starts none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Land, tag, and publish
        shell: bash # -eo pipefail: a failed land fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          LANE: ${{ inputs.lane }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
        run: |
          uvx --from "$TOOL" shipyard land --lane "$LANE" --version "$VERSION" --sha "$SHA" --base "$BASE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Closes the lane's "Ready to release" issue, with the tag and this run. It sets no
  # permissions, so it runs with the caller's grant: under release = "propose" closing needs
  # `issues: write` on the caller's land job; without it this job fails, after the release
  # landed. Under any other release autonomy it reads nothing from GitHub
  close-proposal:
    needs: land
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Close the lane's proposal issue
        shell: bash # -eo pipefail: a failed close fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          LANE: ${{ inputs.lane }}
          VERSION: ${{ inputs.version }}
        run: |
          uvx --from "$TOOL" shipyard close-proposal --lane "$LANE" --version "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: land
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Delete the work branch
        env:
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
        run: uvx --from "$TOOL" shipyard cleanup --version "$VERSION"
